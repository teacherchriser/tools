
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Newsroom</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #222;
}

/* HEADER */

header {
    background: #111827;
    color: white;
    padding: 25px 20px;
}

.header-container {
    max-width: 1200px;
    margin: auto;
}

.logo {
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 1px;
}

.tagline {
    margin-top: 6px;
    color: #cbd5e1;
    font-size: 15px;
}

/* CONTROLS */

.controls {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 20px;

    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 12px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 15px;
    background: white;
}

/* NEWS GRID */

.news-container {
    max-width: 1200px;
    margin: auto;
    padding: 0 20px 40px;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

/* CARD */

.news-card {
    background: white;
    border-radius: 10px;
    overflow: hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

    transition: transform 0.2s;
}

.news-card:hover {
    transform: translateY(-3px);
}

.news-image {
    width: 100%;
    height: 190px;
    object-fit: cover;
    background: #e5e7eb;
}

.news-content {
    padding: 18px;
}

.category {
    display: inline-block;

    font-size: 12px;
    font-weight: bold;

    background: #e5e7eb;
    color: #374151;

    padding: 5px 8px;
    border-radius: 4px;

    margin-bottom: 10px;
}

.news-title {
    font-size: 21px;
    line-height: 1.25;
    margin: 5px 0 10px;
}

.summary {
    color: #4b5563;
    line-height: 1.5;
    font-size: 15px;
}

.meta {
    margin-top: 15px;
    padding-top: 12px;

    border-top: 1px solid #e5e7eb;

    font-size: 13px;
    color: #6b7280;
}

.read-button {
    margin-top: 15px;

    display: inline-block;

    background: #111827;
    color: white;

    padding: 9px 13px;

    border-radius: 5px;

    text-decoration: none;

    cursor: pointer;
}

/* EMPTY / LOADING */

.message {
    max-width: 1200px;
    margin: 40px auto;
    padding: 20px;
    text-align: center;
    color: #6b7280;
}

/* MODAL */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.65);

    z-index: 1000;

    overflow-y: auto;
}

.modal-box {
    background: white;

    max-width: 850px;

    margin: 50px auto;

    border-radius: 10px;

    overflow: hidden;
}

.modal-image {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
}

.modal-content {
    padding: 30px;
}

.modal-title {
    font-size: 32px;
    margin-bottom: 10px;
}

.modal-meta {
    color: #6b7280;
    margin-bottom: 25px;
}

.modal-text {
    line-height: 1.7;
    font-size: 17px;
}

.close {
    float: right;

    font-size: 28px;

    cursor: pointer;

    color: #555;
}

/* RESPONSIVE */

@media (max-width: 900px) {

    .news-container {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 650px) {

    .controls {
        grid-template-columns: 1fr;
    }

    .news-container {
        grid-template-columns: 1fr;
    }

    .logo {
        font-size: 27px;
    }

}

</style>

</head>

<body>

<header>

<div class="header-container">

<div class="logo">
📰 Student Newsroom
</div>

<div class="tagline">
News reported, written and shared by our students
</div>

</div>

</header>


<div class="controls">

<input
    type="text"
    id="search"
    placeholder="Search news..."
>

<select id="category">
    <option value="">All categories</option>
</select>

<select id="borough">
    <option value="">All boroughs</option>
</select>

</div>


<div id="message" class="message">
Loading student news...
</div>


<div id="newsContainer" class="news-container"></div>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="modal-box">

<img
    id="modalImage"
    class="modal-image"
>

<div class="modal-content">

<span
    class="close"
    onclick="closeModal()"
>
×
</span>

<div
    id="modalTitle"
    class="modal-title"
></div>

<div
    id="modalMeta"
    class="modal-meta"
></div>

<div
    id="modalText"
    class="modal-text"
></div>

</div>

</div>

</div>


<script>

/* =====================================
   GOOGLE APPS SCRIPT API
===================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyW1FekBlGlOWcpA1va9Hks3At9zip_--Z9_ZQR4TUHxf4D7Bbzu6cz9DP66Hd3PY8jWA/exec";


let allNews = [];


/* =====================================
   LOAD NEWS
===================================== */

async function loadNews() {

    try {

        const response =
            await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Network error");
        }

        allNews =
            await response.json();

        document.getElementById("message")
            .style.display = "none";

        createFilters();

        displayNews(allNews);

    }

    catch(error) {

        console.error(error);

        document.getElementById("message")
            .innerHTML =
            "Sorry. The student news could not be loaded right now.";

    }

}


/* =====================================
   CREATE FILTERS
===================================== */

function createFilters() {

    const categories =
        [...new Set(
            allNews
            .map(item => item["Category"])
            .filter(Boolean)
        )];

    const boroughs =
        [...new Set(
            allNews
            .map(item => item["Borough"])
            .filter(Boolean)
        )];


    const categorySelect =
        document.getElementById("category");

    categories.sort().forEach(category => {

        const option =
            document.createElement("option");

        option.value = category;
        option.textContent = category;

        categorySelect.appendChild(option);

    });


    const boroughSelect =
        document.getElementById("borough");

    boroughs.sort().forEach(borough => {

        const option =
            document.createElement("option");

        option.value = borough;
        option.textContent = borough;

        boroughSelect.appendChild(option);

    });

}


/* =====================================
   DISPLAY NEWS
===================================== */

function displayNews(news) {

    const container =
        document.getElementById("newsContainer");

    container.innerHTML = "";


    if (news.length === 0) {

        container.innerHTML =
            "<div class='message'>No news found.</div>";

        return;

    }


    news.forEach((item, index) => {

        const card =
            document.createElement("article");

        card.className =
            "news-card";


        const imageURL = getDriveImageURL(item["Picture"]);

const imageHTML =
    imageURL
    ?
    `<img
        class="news-image"
        src="${imageURL}"
        alt="News photograph"
        onerror="this.style.display='none'"
    >`
    :
    `<div class="news-image"></div>`;


        card.innerHTML = `

            ${imageHTML}

            <div class="news-content">

                <div class="category">
                    ${escapeHTML(item["Category"] || "News")}
                </div>

                <h2 class="news-title">
                    ${escapeHTML(item["News Title"] || "Untitled")}
                </h2>

                <div class="summary">
                    ${escapeHTML(item["Summary"] || "")}
                </div>

                <div class="meta">

                    👤 ${escapeHTML(item["Author:"] || "Unknown")}

                    <br>

                    📍 ${escapeHTML(item["Borough"] || "")}

                </div>

                <div
                    class="read-button"
                    onclick="openModal(${index})"
                >
                    Read full report →
                </div>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =====================================
   SEARCH & FILTER
===================================== */

function filterNews() {

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();


    const category =
        document.getElementById("category")
        .value;


    const borough =
        document.getElementById("borough")
        .value;


    const filtered =
        allNews.filter(item => {

            const text = [

                item["News Title"],
                item["Summary"],
                item["Content"],
                item["Author"]

            ]
            .join(" ")
            .toLowerCase();


            return (

                text.includes(search)

                &&

                (!category ||
                 item["Category"] === category)

                &&

                (!borough ||
                 item["Borough"] === borough)

            );

        });


    displayNews(filtered);

}


document
    .getElementById("search")
    .addEventListener(
        "input",
        filterNews
    );


document
    .getElementById("category")
    .addEventListener(
        "change",
        filterNews
    );


document
    .getElementById("borough")
    .addEventListener(
        "change",
        filterNews
    );


/* =====================================
   MODAL
===================================== */

function openModal(index) {

    const item =
        allNews[index];


    document.getElementById("modalTitle")
        .textContent =
        item["News Title"] || "";


    document.getElementById("modalMeta")
        .textContent =
        `By ${item["Author"] || "Unknown"} · ${item["Borough"] || ""} · ${item["Category"] || ""}`;


    document.getElementById("modalText")
        .textContent =
        item["Content"] || item["Summary"] || "";


    const image =
        document.getElementById("modalImage");


    if (item["Picture"]) {

        image.src =
            item["Picture"];

        image.style.display =
            "block";

    }

    else {

        image.style.display =
            "none";

    }


    document.getElementById("modal")
        .style.display =
        "block";

}


function closeModal() {

    document.getElementById("modal")
        .style.display =
        "none";

}


window.onclick = function(event) {

    const modal =
        document.getElementById("modal");

    if (event.target === modal) {

        closeModal();

    }

};


/* =====================================
   SECURITY
===================================== */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================
   START
===================================== */

loadNews();

</script>

</body>
</html>
