<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="English-Spanish and Spanish-English dictionary using Free Dictionary API and MyMemory">
<title>Classic English ↔ Spanish Dictionary</title>
<style>
:root{--green:#026f4d;--dark:#01583d;--cream:#f8f5ed;--paper:#fffdf8;--ink:#292929;--muted:#6d6d6d;--line:#d9d3c7}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Times New Roman",Times,serif}
.wrap{max-width:850px;margin:auto;padding:22px 16px 45px}
header{text-align:center;padding:15px 0 22px}
h1{margin:0;color:var(--green);font-size:clamp(2rem,7vw,3.1rem)}
.subtitle{margin:7px 0 0;color:var(--muted);font-size:1.05rem}
.search-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.search-row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px 14px;border:1px solid #bbb;border-radius:9px;font:inherit;font-size:1.05rem;background:white}
button{border:0;border-radius:9px;background:var(--green);color:white;font:inherit;cursor:pointer;padding:10px 15px}
button:hover{background:var(--dark)}
.direction{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.direction button{background:#e7eee9;color:var(--green);border:1px solid #b8ccc2}
.direction button.active{background:var(--green);color:white}
#status{text-align:center;color:var(--muted);margin:18px 0 0}
.card{margin-top:18px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.word-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.word{font-size:2.2rem;color:var(--green);margin:0}
.speaker{width:42px;height:42px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:1.2rem}
.ipa{font-size:1.05rem;color:var(--muted);font-style:italic}
.pos{display:inline-block;margin-top:10px;padding:3px 9px;border-radius:20px;background:#e7eee9;color:var(--green);font-size:.95rem;font-weight:bold}
.translation{font-size:1.2rem;margin:13px 0 5px}
.definition{margin:14px 0;padding-left:16px;border-left:3px solid var(--green)}
.definition strong{color:var(--green)}
.example{margin:5px 0 0;color:#555;font-style:italic}
.loading{text-align:center;color:var(--green);font-size:1.15rem;padding:25px}
.error{text-align:center;color:#8a3d2f;padding:20px}
.note{font-size:.9rem;color:var(--muted);margin-top:15px}
footer{text-align:center;color:var(--muted);font-size:.9rem;margin-top:25px}
@media(max-width:520px){.wrap{padding:14px 11px 35px}.search-row{flex-direction:column}.search-row button{width:100%}.card{padding:16px}.word{font-size:1.9rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>English ↔ Spanish</h1>
<p class="subtitle">A simple classic dictionary for learners</p>
</header>

<section class="search-box">
<div class="search-row">
<input id="search" type="search" placeholder="Search a word..." autocomplete="off">
<button id="searchBtn">Search</button>
</div>
<div class="direction">
<button class="active" data-direction="en-es">English → Spanish</button>
<button data-direction="es-en">Spanish → English</button>
</div>
</section>

<p id="status">Search for any word. Try: hello, environment, beautiful, casa</p>
<main id="results"></main>

<footer>
Classic Dictionary • Free Dictionary API + MyMemory
</footer>
</div>

<script>
let direction="en-es";
const input=document.getElementById("search");
const results=document.getElementById("results");
const status=document.getElementById("status");

document.querySelectorAll(".direction button").forEach(btn=>{
 btn.addEventListener("click",()=>{
   document.querySelectorAll(".direction button").forEach(b=>b.classList.remove("active"));
   btn.classList.add("active");
   direction=btn.dataset.direction;
   if(input.value.trim()) search();
   input.focus();
 });
});

document.getElementById("searchBtn").addEventListener("click",search);
input.addEventListener("keydown",e=>{if(e.key==="Enter")search()});

async function search(){
 const term=input.value.trim();
 if(!term){status.textContent="Type a word to search.";results.innerHTML="";return}

 results.innerHTML='<div class="loading">Searching the dictionary...</div>';
 status.textContent="";

 try{
   if(direction==="en-es") await englishToSpanish(term);
   else await spanishToEnglish(term);
 }catch(error){
   console.error(error);
   results.innerHTML='<div class="error"><strong>Sorry.</strong><br>The dictionary service could not be reached right now. Please try again.</div>';
 }
}

async function englishToSpanish(word){
 const dictURL="https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word);
 const response=await fetch(dictURL);
 if(!response.ok) throw new Error("Word not found");
 const data=await response.json();
 const entry=data[0];

 // Translation is separate because Dictionary API provides English definitions.
 let translation="";
 try{
   translation=await translate(word,"en|es");
 }catch(e){
   translation="Translation unavailable";
 }

 renderEnglishEntry(entry,translation);
}

async function spanishToEnglish(word){
 // MyMemory gives the English equivalent first.
 const translation=await translate(word,"es|en");
 if(!translation) throw new Error("Translation not found");

 // Then ask Dictionary API for English definitions.
 let entry=null;
 try{
   const response=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(translation.split(/[;,]/)[0].trim()));
   if(response.ok){
     const data=await response.json();
     entry=data[0];
   }
 }catch(e){}

 if(entry) renderEnglishEntry(entry,word);
 else renderTranslationOnly(word,translation);
}

async function translate(text,langpair){
 const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+encodeURIComponent(langpair);
 const response=await fetch(url);
 if(!response.ok) throw new Error("Translation service unavailable");
 const data=await response.json();
 if(data.responseStatus!==200 && !data.responseData) throw new Error("Translation failed");
 return data.responseData.translatedText || "";
}

function renderEnglishEntry(entry,translation){
 const word=entry.word||"";
 const ipa=(entry.phonetic || (entry.phonetics||[]).find(p=>p.text)?.text || "Pronunciation unavailable");
 const audio=(entry.phonetics||[]).find(p=>p.audio)?.audio || "";
 let html=`
 <article class="card">
   <div class="word-head">
     <h2 class="word">${esc(word)}</h2>
     <button class="speaker" title="Listen" aria-label="Listen to ${esc(word)}">🔊</button>
     <span class="ipa">${esc(ipa)}</span>
   </div>
   <p class="translation"><strong>Spanish:</strong> ${esc(translation)}</p>
 `;

 let count=0;
 (entry.meanings||[]).forEach(meaning=>{
   html+=`<div class="pos">${esc(meaning.partOfSpeech||"word")}</div>`;
   (meaning.definitions||[]).forEach(def=>{
     count++;
     html+=`
       <div class="definition">
         <strong>${count}.</strong> ${esc(def.definition||"")}
         ${def.example?`<p class="example">“${esc(def.example)}”</p>`:""}
       </div>`;
   });
 });

 html+=`<p class="note">Definitions, phonetics and examples are supplied by the dictionary service. Translation is supplied by MyMemory.</p></article>`;
 results.innerHTML=html;
 status.textContent="Definition found.";

 const speaker=results.querySelector(".speaker");
 speaker.addEventListener("click",()=>{
   if(audio){
     const src=audio.startsWith("//")?"https:"+audio:audio;
     new Audio(src).play().catch(()=>speak(word,"en-US"));
   }else speak(word,"en-US");
 });
}

function renderTranslationOnly(source,translation){
 results.innerHTML=`
 <article class="card">
   <div class="word-head"><h2 class="word">${esc(source)}</h2></div>
   <p class="translation"><strong>English:</strong> ${esc(translation)}</p>
   <p class="note">The translation was found, but a full English dictionary entry was not available.</p>
 </article>`;
 status.textContent="Translation found.";
}

function speak(text,lang){
 if(!("speechSynthesis" in window)){alert("Speech synthesis is not supported by this browser.");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang=lang;
 u.rate=.85;
 speechSynthesis.speak(u);
}

function esc(text){
 return String(text).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
</script>
</body>
</html>
