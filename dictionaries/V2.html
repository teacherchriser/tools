<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diccionario Bilingüe / Bilingual Dictionary</title>
    <style>
        :root {
            --primary-color: #026f4d;
            --primary-light: #e6f1ed;
            --primary-hover: #015239;
            --text-color: #2c2c2c;
            --bg-color: #faf9f6;
            --card-bg: #ffffff;
            --border-color: #dcd6cd;
            --accent-muted: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-style: italic;
            color: var(--accent-muted);
            font-size: 1.05rem;
            margin-top: 5px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            background-color: var(--card-bg);
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(2, 111, 77, 0.15);
        }

        .search-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: var(--primary-hover);
        }

        .results-info {
            font-style: italic;
            margin-bottom: 15px;
            color: var(--accent-muted);
        }

        .word-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary-color);
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .word-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            border-bottom: 1px solid #f0ede6;
            padding-bottom: 8px;
        }

        .word-title {
            font-size: 1.8rem;
            color: var(--primary-color);
            font-weight: bold;
        }

        .phonetic {
            font-family: 'Times New Roman', Times, serif;
            color: var(--accent-muted);
            font-size: 1.1rem;
        }

        .audio-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 2px 6px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background-color 0.2s;
        }

        .audio-btn:hover {
            background-color: var(--primary-light);
            transform: scale(1.1);
        }

        .sense-block {
            margin-top: 12px;
            padding-left: 5px;
        }

        .pos-badge {
            font-style: italic;
            font-weight: bold;
            color: var(--primary-color);
            margin-right: 8px;
        }

        .definition {
            font-size: 1.1rem;
            display: inline;
        }

        .example-box {
            margin-top: 6px;
            margin-left: 15px;
            padding-left: 10px;
            border-left: 2px solid var(--border-color);
            font-style: italic;
            color: #444;
        }

        .example-translation {
            color: #666;
            font-size: 0.95rem;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            background-color: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 4px;
            color: var(--accent-muted);
            font-style: italic;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--accent-muted);
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 10px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .search-container {
                flex-direction: column;
            }
            .search-btn {
                width: 100%;
            }
            .word-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Diccionario Bilingüe</h1>
        <div class="subtitle">English - Español / Español - Inglés</div>
    </header>

    <main>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Escribe una palabra / Type a word..." onkeyup="handleKeyUp(event)">
            </div>
            <button class="search-btn" onclick="performSearch()">Buscar / Search</button>
        </div>

        <div id="resultsContainer">
            <!-- Entries will be rendered here dynamically -->
        </div>
    </main>

    <footer>
        <p>Diccionario Clásico Bilingüe &copy; 2026 — Diseñado para GitHub Pages</p>
    </footer>

    <script>
        // Base de datos del diccionario / Dictionary database
        const dictionary = [
            {
                word: "book",
                lang: "en",
                phonetic: "/bʊk/",
                senses: [
                    {
                        pos: "noun",
                        definition: "Libro. Objeto impreso o digital con hojas de papel o contenido para leer.",
                        example: "She is reading an interesting book.",
                        exampleEs: "Ella está leyendo un libro interesante."
                    },
                    {
                        pos: "verb",
                        definition: "Reservar. Apartar un lugar, asiento o habitación con anticipación.",
                        example: "We need to book a hotel room for our vacation.",
                        exampleEs: "Necesitamos reservar una habitación de hotel para nuestras vacaciones."
                    }
                ]
            },
            {
                word: "libro",
                lang: "es",
                phonetic: "/'li.βɾo/",
                senses: [
                    {
                        pos: "sustantivo / noun",
                        definition: "Book. Conjunto de hojas de papel manuscritas o impresas unidas por un lado.",
                        example: "El libro que me recomendaste es excelente.",
                        exampleEn: "The book you recommended to me is excellent."
                    }
                ]
            },
            {
                word: "run",
                lang: "en",
                phonetic: "/rʌn/",
                senses: [
                    {
                        pos: "verb",
                        definition: "Correr. Moverse rápidamente con los pies.",
                        example: "He runs five miles every morning.",
                        exampleEs: "Él corre cinco millas cada mañana."
                    },
                    {
                        pos: "verb",
                        definition: "Administrar / Gestionar. Estar a cargo de un negocio u organización.",
                        example: "She runs a successful marketing agency.",
                        exampleEs: "Ella administra una agencia de marketing exitosa."
                    },
                    {
                        pos: "noun",
                        definition: "Carrera / Recorrido. Acción de correr o trayecto realizado.",
                        example: "I went for a quick run before breakfast.",
                        exampleEs: "Fui a hacer una carrera rápida antes del desayuno."
                    }
                ]
            },
            {
                word: "correr",
                lang: "es",
                phonetic: "/ko'reɾ/",
                senses: [
                    {
                        pos: "verbo / verb",
                        definition: "Run. Desplazarse rápidamente con pasos largos.",
                        example: "Me gusta correr por el parque los fines de semana.",
                        exampleEn: "I like to run in the park on weekends."
                    }
                ]
            },
            {
                word: "light",
                lang: "en",
                phonetic: "/laɪt/",
                senses: [
                    {
                        pos: "noun",
                        definition: "Luz. Energía que hace visibles las cosas.",
                        example: "Turn on the light, please.",
                        exampleEs: "Enciende la luz, por favor."
                    },
                    {
                        pos: "adjective",
                        definition: "Ligero / Liviano. Que pesa poco.",
                        example: "This jacket is very light but warm.",
                        exampleEs: "Esta chaqueta es muy ligera pero abrigada."
                    },
                    {
                        pos: "adjective",
                        definition: "Claro. Referido a colores de tono suave.",
                        example: "She bought a light blue shirt.",
                        exampleEs: "Ella compró una camisa azul clara."
                    }
                ]
            },
            {
                word: "luz",
                lang: "es",
                phonetic: "/luθ/ o /lus/",
                senses: [
                    {
                        pos: "sustantivo / noun",
                        definition: "Light. Agente físico que hace visibles los objetos.",
                        example: "Entra mucha luz por la ventana.",
                        exampleEn: "A lot of light comes through the window."
                    }
                ]
            },
            {
                word: "peaceful",
                lang: "en",
                phonetic: "/ˈpiːs.fəl/",
                senses: [
                    {
                        pos: "adjective",
                        definition: "Tranquilo / Pacífico. Libre de disturbios, ruidos o violencia.",
                        example: "It was a peaceful afternoon in the countryside.",
                        exampleEs: "Fue una tarde tranquila en el campo."
                    }
                ]
            },
            {
                word: "paz",
                lang: "es",
                phonetic: "/paθ/ o /pas/",
                senses: [
                    {
                        pos: "sustantivo / noun",
                        definition: "Peace. Situación o estado de tranquilidad y quietud.",
                        example: "Respirar aire puro me transmite mucha paz.",
                        exampleEn: "Breathing fresh air gives me a lot of peace."
                    }
                ]
            }
        ];

        // Función para reproducir la pronunciación utilizando Web Speech API
        function speak(text, lang) {
            if ('speechSynthesis' in window) {
                // Cancelar cualquier audio en curso
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                // Asignar el idioma de pronunciación
                utterance.lang = (lang === 'en') ? 'en-US' : 'es-ES';
                utterance.rate = 0.9; // Velocidad ligeramente pausada para claridad
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Tu navegador no soporta la función de audio / Your browser does not support audio playback.");
            }
        }

        // Renderizar todos los elementos o resultados filtrados
        function renderDictionary(data) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <p>No se encontraron resultados para tu búsqueda.</p>
                        <p><em>No entry found for your search.</em></p>
                    </div>
                `;
                return;
            }

            data.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'word-card';

                let sensesHTML = '';
                entry.senses.forEach((sense, index) => {
                    const exTrans = sense.exampleEs ? sense.exampleEs : (sense.exampleEn ? sense.exampleEn : '');
                    sensesHTML += `
                        <div class="sense-block">
                            <span class="pos-badge">${index + 1}. (${sense.pos})</span>
                            <span class="definition">${sense.definition}</span>
                            <div class="example-box">
                                "${sense.example}"
                                ${exTrans ? `<div class="example-translation">${exTrans}</div>` : ''}
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="word-header">
                        <span class="word-title">${entry.word}</span>
                        <span class="phonetic">${entry.phonetic}</span>
                        <button class="audio-btn" onclick="speak('${entry.word.replace(/'/g, "\'")}', '${entry.lang}')" title="Escuchar pronunciación">
                            🔊
                        </button>
                    </div>
                    ${sensesHTML}
                `;

                container.appendChild(card);
            });
        }

        // Búsqueda en tiempo real o al presionar botón
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                renderDictionary(dictionary);
                return;
            }

            const filtered = dictionary.filter(entry => {
                const matchWord = entry.word.toLowerCase().includes(query);
                const matchDef = entry.senses.some(s => s.definition.toLowerCase().includes(query));
                return matchWord || matchDef;
            });

            renderDictionary(filtered);
        }

        function handleKeyUp(event) {
            performSearch();
        }

        // Inicializar mostrando todo el contenido
        window.onload = function() {
            renderDictionary(dictionary);
        };
    </script>
</body>
</html>
