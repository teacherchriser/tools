<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>This Is Happening — Photo Challenge</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Lobster&family=MonteCarlo&display=swap');
</style>

<style>
*{box-sizing:border-box} body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center}
h1{font-size:1.35rem;margin:14px 8px 4px}.hint{font-size:.9rem;color:#bbb;margin:0 12px 12px}
#stage{position:relative;width:min(92vw,430px);margin:auto;overflow:hidden;background:#000;border-radius:14px}
video,canvas{display:block;width:100%;height:auto}
#overlay{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:30px 5px; <!-- background:rgba(0,0,0,.37) -->
font-weight:800;font-size:clamp(25px,7vw,39px);letter-spacing:.04em}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
#start{background:#fff;color:#111} #shot{background:#ffd400;color:#111} #flip{background:#333;color:#fff}
#download{display:none;background:#36d17c;color:#07140d}
#status{min-height:1.2em;color:#aaa;font-size:.85rem}
</style>
</head>
<body>
<h1 style="font-family: 'Lobster', sans-serif;">📸 Photography Challenge</h1>
<p class="hint">Show what is happening around you. The words stay in the middle of your photo.</p>
<div id="stage">
  <video id="video" autoplay playsinline></video>
  <div id="overlay" style="font-family: 'MonteCarlo', cursive; font-size: 35px; text-shadow: 3px 3px 5px #000000;">This is happening</div>
</div>
<div class="controls">
  <button id="start">Open camera</button>
  <button id="shot" disabled>Take photo</button>
  <button id="flip" disabled>Flip camera</button>
  <a id="download"><button>Save photo</button></a>
</div>
<p id="status"></p>
<canvas id="canvas" hidden></canvas>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

const start = document.getElementById('start');
const shot = document.getElementById('shot');
const flip = document.getElementById('flip');

const download = document.getElementById('download');
const status = document.getElementById('status');

let stream = null;
let facing = 'environment';


// ========================================
// LOGO UPN
// ========================================

const logo = new Image();
logo.src = 'logo_upn.png';


// ========================================
// ABRIR CÁMARA
// ========================================

async function openCamera() {

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  try {

    // CONFIGURACIÓN ORIGINAL
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: facing
        }
      },
      audio: false
    });

    video.srcObject = stream;

    shot.disabled = false;
    flip.disabled = false;

    status.textContent = 'Camera ready.';

  } catch (e) {

    console.error(e);

    status.textContent =
      'Camera access was blocked. Open this page in Chrome/Safari and allow camera permission.';

  }
}


// ========================================
// START
// ========================================

start.onclick = openCamera;


// ========================================
// FLIP CAMERA
// ========================================

flip.onclick = () => {

  facing =
    facing === 'environment'
      ? 'user'
      : 'environment';

  openCamera();

};


// ========================================
// TOMAR FOTO
// ========================================

shot.onclick = () => {

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  if (!vw || !vh) return;


  // ========================================
  // FORMATO FINAL 4:5
  // ========================================

  // Usamos una resolución final alta,
  // pero NO modificamos la resolución de la cámara.

  const finalWidth = 1600;
  const finalHeight = 2000;

  canvas.width = finalWidth;
  canvas.height = finalHeight;

  const ctx = canvas.getContext('2d');


  // ========================================
  // MARCO BLANCO
  // ========================================

  ctx.fillStyle = '#ffffff';

  ctx.fillRect(
    0,
    0,
    finalWidth,
    finalHeight
  );


  // ========================================
  // MARCO
  // ========================================

  const border =
    Math.round(finalWidth * 0.035);

  const bottomSpace =
    Math.round(finalWidth * 0.16);


  // ========================================
  // ÁREA DE LA FOTO
  // ========================================

  const photoX = border;
  const photoY = border;

  const photoWidth =
    finalWidth - border * 2;

  const photoHeight =
    finalHeight -
    border -
    bottomSpace;


  // ========================================
  // RECORTE 4:5
  // ========================================

  const targetRatio =
    photoWidth / photoHeight;

  const videoRatio =
    vw / vh;

  let sx = 0;
  let sy = 0;
  let sw = vw;
  let sh = vh;


  if (videoRatio > targetRatio) {

    sw = vh * targetRatio;

    sx = (vw - sw) / 2;

  } else {

    sh = vw / targetRatio;

    sy = (vh - sh) / 2;

  }


  // ========================================
  // FOTO
  // ========================================

  ctx.drawImage(
    video,
    sx,
    sy,
    sw,
    sh,
    photoX,
    photoY,
    photoWidth,
    photoHeight
  );


  // ========================================
  // LOGO UPN
  // ========================================

  if (
    logo.complete &&
    logo.naturalWidth > 0
  ) {

    const maxLogoWidth =
      photoWidth * 0.15;

    const maxLogoHeight =
      photoHeight * 0.15;


    const logoRatio = Math.min(
      maxLogoWidth / logo.naturalWidth,
      maxLogoHeight / logo.naturalHeight
    );


    const logoWidth =
      logo.naturalWidth * logoRatio;

    const logoHeight =
      logo.naturalHeight * logoRatio;


    const logoMargin =
      photoWidth * 0.03;


    const logoX =
      photoX +
      photoWidth -
      logoWidth -
      logoMargin;

    const logoY =
      photoY +
      logoMargin;


    ctx.drawImage(
      logo,
      logoX,
      logoY,
      logoWidth,
      logoHeight
    );

  }


  // ========================================
  // TEXTO
  // ========================================

  const fontSize =
    Math.max(
      28,
      Math.round(photoWidth * 0.095)
    );


  ctx.font =
    `800 ${fontSize}px 'MonteCarlo', cursive`;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';


  // Sombra
  ctx.fillStyle =
    'rgba(0,0,0,.6)';

  ctx.fillText(
    'This is happening',
    photoX + photoWidth / 2,
    photoY + photoHeight / 2 + 3
  );


  // Texto
  ctx.fillStyle = '#fff';

  ctx.fillText(
    'This is happening',
    photoX + photoWidth / 2,
    photoY + photoHeight / 2
  );


  // ========================================
  // GUARDAR
  // ========================================

  download.href =
    canvas.toDataURL(
      'image/jpeg',
      0.95
    );

  download.download =
    'this-is-happening.jpg';

  download.style.display =
    'inline-block';

  status.textContent =
    'Photo ready — tap “Save photo”.';

};
</script>
</body>
</html>
